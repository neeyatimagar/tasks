<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Time Chart</title>

    <link rel="stylesheet" href="timechart.css">
</head>

<body>

    <div class="container">

        <div class="timer">
            00 : 00 : 00
        </div>

        <div class="buttons">

            <button class="start" onclick="startTimer()">
                start
            </button>

            <button class="pause" onclick="pauseTimer()">
                pause
            </button>

            <button class="reset" onclick="resetTimer()">
                reset
            </button>

        </div>

    </div>

    <script src="timechart.js"></script>

</body>

</html>
